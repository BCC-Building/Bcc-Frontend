    <!--  PERFORMANCE: Inline Critical CSS (Above-fold styles) -->
    <style>
      /* Prevent Flash of Invisible Text */
      @font-face {
        font-family: 'bootstrap-icons';
        font-display: swap;
        src: url("https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/fonts/bootstrap-icons.woff2") format("woff2");
      }
      
      /* Base styles - visible immediately */
      :root {
        --bs-body-font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
      }
      
      body {
        font-family: system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif;
        margin: 0;
        padding: 0;
        visibility: visible;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
        text-rendering: optimizeLegibility;
      }
      
      /* Prevent layout shift - Navbar placeholder */
      nav.fixed {
        height: 64px;
        background: #ffffff;
        contain: layout style paint;
      }
      
      /* Prevent layout shift - Hero placeholder */
      .hero {
        min-height: calc(100vh - 64px);
        background: #0a1628;
        contain: layout style;
      }
      
      /* Prevent layout shift - Images */
      img {
        max-width: 100%;
        height: auto;
      }
      
      /* Skip to content - Accessibility */
      .skip-link {
        position: absolute;
        top: -100%;
        left: 0;
        z-index: 10000;
        padding: 12px 20px;
        background: #0d6efd;
        color: #ffffff;
        font-weight: 600;
        text-decoration: none;
        border-radius: 0 0 4px 0;
        transition: top 0.2s ease;
      }
      .skip-link:focus {
        top: 0;
        outline: 3px solid #ffffff;
        outline-offset: -6px;
      }
      
      @media (min-width: 768px) {
        nav.fixed { height: 80px; }
        .hero { min-height: calc(100vh - 80px); }
      }
    </style>

    <!--  PERFORMANCE: Service Worker Registration (Optional - for offline support) -->
    <script>
      // Detect when page is fully loaded
      window.addEventListener('load', () => {
        // Remove loading states
        document.body.classList.add('loaded');
        
        // Performance monitoring
        if ('performance' in window && 'PerformanceObserver' in window) {
          // Log LCP
          new PerformanceObserver((list) => {
            const entries = list.getEntries();
            if (entries.length > 0) {
              const lcp = entries[entries.length - 1];
              console.log('LCP:', Math.round(lcp.startTime) + 'ms', lcp.element);
            }
          }).observe({ type: 'largest-contentful-paint', buffered: true });
          
          // Log CLS
          let cls = 0;
          new PerformanceObserver((list) => {
            for (const entry of list.getEntries()) {
              if (!entry.hadRecentInput) cls += entry.value;
            }
            console.log('CLS:', cls.toFixed(3));
          }).observe({ type: 'layout-shift', buffered: true });
        }
      });
    </script>
